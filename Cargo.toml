[package]
name = "aviary"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeromq = { path = "vendor/zeromq", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
bytes = "1"

[dev-dependencies]
zmq = "0.10"

##### MOCULL AUTOGENERATED ### DO NOT EDIT #####
[lints.rust]
missing_docs = "warn"

[lints.clippy]
# https://rust-lang.github.io/rust-clippy/master/index.html#/
unwrap_used = "deny"
indexing_slicing = "deny"
inefficient_to_string = "warn"
use_self = "warn"
implicit_clone = "warn"
